name: Rust CLI CI

on:
  workflow_call:
    inputs:
      release:
        description: Build optimized archives for publishing
        type: boolean
        default: false
    outputs:
      LINUX_SHA256:
        description: SHA256 of the Linux release archive
        value: ${{ jobs.build-linux.outputs.SHA256 }}
      MACOS_SHA256:
        description: SHA256 of the macOS release archive
        value: ${{ jobs.build-macos.outputs.SHA256 }}
      WINDOWS_SHA256:
        description: SHA256 of the Windows release archive
        value: ${{ jobs.build-windows.outputs.SHA256 }}
  push:
    branches-ignore:
      - "master"
      - "next"
    paths:
      - "zowex/**"
      - '.github/workflows/rust-cli*.yml'
  pull_request:
    paths:
      - "zowex/**"
      - '.github/workflows/rust-cli*.yml'

defaults:
  run:
    shell: bash

env:
  BUILD_PROFILE: ${{ inputs.release && 'release' || 'debug' }}
  CARGO_PROFILE: ${{ inputs.release && 'release' || 'dev' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    if: inputs.release || ((github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && !contains(github.event.head_commit.message, '[ci skip]'))

    outputs:
      SHA256: ${{ steps.digest.outputs.SHA256 }}
    env:
      ARCHIVE_FILE: zowe-linux.tgz

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        components: clippy

    - name: Prepare Cross
      run: cargo install cross@0.2.5

    # Need to build in container with old version of GLIBC to support RHEL 7
    # https://kobzol.github.io/rust/ci/2021/05/07/building-rust-binaries-in-ci-that-work-with-older-glibc.html
    - name: Build
      working-directory: zowex
      run: cross build --verbose --profile "$CARGO_PROFILE"

    - name: Create Archive
      run: |
        cd "zowex/target/x86_64-unknown-linux-gnu/$BUILD_PROFILE"
        tar -cvzf "$ARCHIVE_FILE" zowe

    - name: Hash Archive
      if: inputs.release
      id: digest
      run: echo "SHA256=$(sha256sum "zowex/target/x86_64-unknown-linux-gnu/$BUILD_PROFILE/$ARCHIVE_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Archive Results
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARCHIVE_FILE }}
        path: zowex/target/x86_64-unknown-linux-gnu/${{ env.BUILD_PROFILE }}/${{ env.ARCHIVE_FILE }}
        if-no-files-found: error

    - name: Run linter
      run: |
        cargo clippy --manifest-path=zowex/Cargo.toml

    - name: Run tests
      run: cargo test unit --verbose --manifest-path=zowex/Cargo.toml -- --nocapture

  build-macos:
    name: Build MacOS
    runs-on: macos-latest
    if: inputs.release || ((github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && !contains(github.event.head_commit.message, '[ci skip]'))

    outputs:
      SHA256: ${{ steps.digest.outputs.SHA256 }}
    env:
      ARCHIVE_FILE: zowe-macos.tgz

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: x86_64-apple-darwin

    - name: Build
      working-directory: zowex
      run: |
        cargo build --verbose --profile "$CARGO_PROFILE" --target aarch64-apple-darwin
        cargo build --verbose --profile "$CARGO_PROFILE" --target x86_64-apple-darwin
        mkdir -p "target/$BUILD_PROFILE" && cd "target/$BUILD_PROFILE"
        mv "../aarch64-apple-darwin/$BUILD_PROFILE/zowe" zowe.aarch64 && mv "../x86_64-apple-darwin/$BUILD_PROFILE/zowe" zowe.x86_64
        lipo -create -output zowe zowe.aarch64 zowe.x86_64

    # Use gtar instead of tar on MacOS to prevent extra `GNUSparseFile.0` directory
    - name: Create Archive
      run: |
        cd "zowex/target/$BUILD_PROFILE"
        gtar -cvzf "$ARCHIVE_FILE" zowe

    - name: Hash Archive
      if: inputs.release
      id: digest
      run: echo "SHA256=$(shasum -a 256 "zowex/target/$BUILD_PROFILE/$ARCHIVE_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Archive Results
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARCHIVE_FILE }}
        path: zowex/target/${{ env.BUILD_PROFILE }}/${{ env.ARCHIVE_FILE }}
        if-no-files-found: error

    - name: Run tests
      run: cargo test unit --verbose --manifest-path=zowex/Cargo.toml -- --nocapture

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: inputs.release || ((github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) && !contains(github.event.head_commit.message, '[ci skip]'))

    outputs:
      SHA256: ${{ steps.digest.outputs.SHA256 }}
    env:
      ARCHIVE_FILE: zowe-windows.tgz

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Build
      working-directory: zowex
      run: cargo build --verbose --profile "$CARGO_PROFILE"
      env:
        RUSTFLAGS: "-Ctarget-feature=+crt-static"

    - name: Create Archive
      run: |
        cd "zowex/target/$BUILD_PROFILE"
        tar -cvzf "$ARCHIVE_FILE" zowe.exe

    - name: Hash Archive
      if: inputs.release
      id: digest
      run: echo "SHA256=$(sha256sum "zowex/target/$BUILD_PROFILE/$ARCHIVE_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Archive Results
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARCHIVE_FILE }}
        path: zowex/target/${{ env.BUILD_PROFILE }}/${{ env.ARCHIVE_FILE }}
        if-no-files-found: error

    - name: Run tests
      run: cargo test unit --verbose --manifest-path=zowex/Cargo.toml -- --nocapture
