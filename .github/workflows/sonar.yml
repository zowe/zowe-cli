name: SonarCloud

on:
  workflow_run:
    workflows: ["Zowe CLI"]
    types: [completed]

jobs:
  sonar:
    runs-on: ubuntu-22.04
    if: github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_branch }}
        fetch-depth: 0

    - name: Configure Sonar Scan
      uses: zowe-actions/octorelease/script@e0672bf28f74f36219713afe75915ea2dc7bf85b # v1
      env:
        COVERAGE_ARTIFACT: "Linux-20.x-results:__tests__/__results__"
      with:
        script: sonarConfig

    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
