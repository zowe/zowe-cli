name: SonarCloud

on:
  workflow_run:
    workflows: ["Zowe CLI"]
    types: [completed]

# This workflow runs in the base repo context with access to secrets, even for fork PRs.
# Nothing from the (untrusted) PR head may influence how the scanner is configured or where the token is sent.
permissions:
  contents: read
  actions: read # Download coverage artifact from the triggering run
  pull-requests: read # Look up the PR associated with the triggering run

jobs:
  sonar:
    runs-on: ubuntu-22.04
    if: github.event.workflow_run.conclusion == 'success'

    steps:
    # Trusted scanner configuration comes from the base repo (this workflow runs from its default branch)
    - name: Checkout Trusted Config
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: trusted
        persist-credentials: false
        sparse-checkout: |
          sonar-project.properties
          lerna.json
          package.json
        sparse-checkout-cone-mode: false

    # PR head is only checked out as source code for analysis and is never executed
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false

    # Replace every file that feeds scanner configuration with the trusted copy
    - name: Restore Trusted Config
      run: |
        cp -f trusted/sonar-project.properties sonar-project.properties
        cp -f trusted/package.json package.json
        if [ -f trusted/lerna.json ]; then cp -f trusted/lerna.json lerna.json; else rm -f lerna.json; fi
        rm -rf trusted

    - name: Configure Sonar Scan
      uses: zowe-actions/octorelease/script@6cf71bdb7ca82117775295e076d63fe7a812f3c8 # v1
      env:
        COVERAGE_ARTIFACT: "Linux-20.x-results:__tests__/__results__"
      with:
        script: sonarConfig

    # Command-line properties take precedence over sonar-project.properties, so pin host and project identity
    - name: SonarCloud Scan
      uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
      with:
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=zowe
          -Dsonar.projectKey=zowe_zowe-cli
